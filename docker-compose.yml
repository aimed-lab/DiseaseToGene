services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: disease2target:latest
    container_name: diseasetotarget
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Every variable comes from .env. This deliberately does NOT re-list them under
    # `environment:` — that block takes precedence over env_file, so any variable the
    # host shell happens not to export would resolve to an empty string and silently
    # override the real value from .env.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
